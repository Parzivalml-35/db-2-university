# Plan B: si el PC no tiene MySQL instalado pero sí Docker Desktop.
#   docker compose up -d
#   docker compose exec mysql mysql -uroot -proot university
# Al primer arranque carga sql/todo_en_uno.sql automáticamente.
# Contraseña de demostración: solo para uso local en clase.
services:
  mysql:
    image: mysql:8.4
    container_name: taller_university
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"   # 3307 en el PC para no chocar con un MySQL ya instalado
    volumes:
      - ./sql/todo_en_uno.sql:/docker-entrypoint-initdb.d/todo_en_uno.sql:ro
